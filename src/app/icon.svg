<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#237A57"/>
      <stop offset="1" stop-color="#185C43"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Ribbon "S" + amber spark glyph — mirrors src/components/SabaqLogoMark.tsx exactly,
       scaled from its native 100x100 viewBox down to fit inside the circular badge. Scaled
       smaller than the old squircle version (0.41 -> 0.36): a circle cuts into the corners
       more, and the spark node sits right in that corner, so it needs the extra margin to
       clear the rim. -->
  <g transform="translate(14,14) scale(0.36)">
    <path
      d="M72,26 C72,15 61,9 50,9 C37,9 26,17 26,28 C26,40 39,43 50,47 C63,51 74,55 74,70 C74,83 63,91 50,91 C39,91 28,86 28,75"
      stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none"
    />
    <circle cx="72" cy="26" r="7.5" fill="#F2B84B"/>
  </g>

  <!-- "Ai" badge — matches SabaqLogoBadge.tsx's white pill overlapping the top-right corner. -->
  <circle cx="51" cy="13" r="11" fill="#FFFFFF"/>
  <text
    x="51" y="13.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="10"
    fill="#185C43"
  >Ai</text>
</svg>
