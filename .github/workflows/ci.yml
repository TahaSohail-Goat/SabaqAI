name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo — no reason for the default GITHUB_TOKEN
          # to persist in the local git config for a later step or third-party action to read.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint (type check)
        run: npm run lint

      - name: Build
        run: npm run build
